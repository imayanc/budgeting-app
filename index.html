<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Budget App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Budget App</h1>
            <p class="subtitle">Track your income and expenses</p>
        </header>

        <!-- Budget Summary -->
        <div class="summary">
            <div class="summary-card income">
                <h3>Total Income</h3>
                <p class="amount" id="totalIncome">$0.00</p>
            </div>
            <div class="summary-card expense">
                <h3>Total Expenses</h3>
                <p class="amount" id="totalExpense">$0.00</p>
            </div>
            <div class="summary-card balance">
                <h3>Balance</h3>
                <p class="amount" id="balance">$0.00</p>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="form-container">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Salary, Groceries" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="salary">Salary</option>
                            <option value="food">Food</option>
                            <option value="transport">Transport</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="utilities">Utilities</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-add">Add Transaction</button>
            </form>
        </div>

        <!-- Transactions List -->
        <div class="transactions-container">
            <h2>Transactions</h2>
            <div id="transactionsList" class="transactions-list">
                <p class="empty-state">No transactions yet. Add one to get started!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
